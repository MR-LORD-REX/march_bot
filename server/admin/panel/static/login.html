<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>HSR Admin</title>
  <link rel="stylesheet" href="/admin/static/panel.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">✦</div>
    <p class="eyebrow">March 7th · Control room</p>
    <h1>Admin access</h1>
    <p class="muted">This panel accepts only owner, admin, and moderator accounts issued by the bot.</p>
    <p id="login-status" class="status" role="status"></p>
    <button id="request-login" class="button primary" type="button">Get a login link from the bot</button>
    <p class="hint">Open Telegram, send <code>/admin_panel</code> to the bot, then tap the button it returns.</p>
    <a class="text-link" href="https://t.me/">Open Telegram</a>
  </main>
  <script src="/admin/static/login.js"></script>
</body>
</html>
